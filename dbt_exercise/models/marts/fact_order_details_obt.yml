version: 2

models:
- name: fact_order_details_obt
  description: 'Fato detalhado de itens dos pedidos do Northwind, incluindo chaves técnicas, clientes, funcionários, produtos, valores e status.'
  columns:
    - name: sk_orders
      description: 'Surrogate key do detalhe do pedido (pedido + cliente + funcionário + produto + ship_id)'
      tests:
        - not_null
        - unique
    - name: order_id
      description: 'Identificador do pedido original'
      tests:
        - not_null
    - name: customer_id
      description: 'ID do cliente original'
      tests:
        - not_null
    - name: customer_name
      description: 'Nome da empresa cliente'
    - name: customer_contact_name
      description: 'Nome do contato principal do cliente'
    - name: customer_contact_title
      description: 'Cargo do contato principal do cliente'
    - name: customer_address
      description: 'Endereço do cliente'
    - name: customer_city
      description: 'Cidade do cliente'
    - name: customer_region
      description: 'Região do cliente'
    - name: customer_country
      description: 'País do cliente'
    - name: customer_continent
      description: 'Continente do cliente'
    - name: employee_id
      description: 'ID do funcionário original'
      tests:
        - not_null
    - name: employee_name
      description: 'Nome completo do funcionário'
    - name: employee_title
      description: 'Cargo do funcionário'
    - name: employee_address
      description: 'Endereço do funcionário'
    - name: employee_city
      description: 'Cidade do funcionário'
    - name: employee_region
      description: 'Região do funcionário'
    - name: employee_country
      description: 'País do funcionário'
    - name: order_date
      description: 'Data em que o pedido foi realizado'
    - name: required_date
      description: 'Data em que o pedido deveria ser entregue'
    - name: shipped_date
      description: 'Data em que o pedido foi enviado'
    - name: days_to_ship
      description: 'Quantidade de dias entre a data do pedido e o envio'
    - name: ship_id
      description: 'Chave técnica da entrega/transportadora'
    - name: ship_via
      description: 'Identificador da transportadora utilizada'
    - name: shipper_name
      description: 'Nome da transportadora'
    - name: product_id
      description: 'ID do produto original'
      tests:
        - not_null
    - name: product_name
      description: 'Nome do produto'
    - name: quantity_per_unit
      description: 'Quantidade por unidade do produto'
    - name: category_name
      description: 'Categoria do produto'
    - name: supplier_name
      description: 'Nome do fornecedor do produto'
    - name: supplier_city
      description: 'Cidade do fornecedor do produto'
    - name: supplier_region
      description: 'Região do fornecedor do produto'
    - name: supplier_country
      description: 'País do fornecedor do produto'
    - name: supplier_continent
      description: 'Continente do fornecedor do produto'
    - name: is_discontinued
      description: 'Indica se o produto está descontinuado'
      tests:
        - accepted_values:
            values: [true, false]
            quote: false
    - name: quantity
      description: 'Quantidade do item no pedido'
    - name: amount
      description: 'Valor total do item no pedido (considerando desconto)'
    - name: rationed_shipping
      description: 'Valor do frete racionado por item no pedido'
    - name: ship_name
      description: 'Nome do destinatário do pedido'
    - name: ship_address
      description: 'Endereço de entrega do pedido'
    - name: ship_city
      description: 'Cidade de entrega do pedido'
    - name: ship_region
      description: 'Região de entrega do pedido'
    - name: ship_country
      description: 'País de entrega do pedido'
    - name: ship_continent
      description: 'Continente de entrega do pedido'
    - name: is_shipped
      description: 'Indica se o item já foi enviado (True/False)'
      tests:
        - accepted_values:
            values: [true, false]
            quote: false
